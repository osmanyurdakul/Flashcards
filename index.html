<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards</title>
<meta name="theme-color" content="#2c5fd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Flashcards">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1d1b;--mut:#6b6a64;--line:#e3e1da;--acc:#2c5fd8;--accInk:#fff;--ok:#1f8a4c;--okBg:#e3f4ea;--bad:#c23b3b;--badBg:#fbe7e7;--warn:#a96a00;--warnBg:#fdf1d9;--rec:#d93636}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1f1f1d;--ink:#f1f0ea;--mut:#a09f97;--line:#33332f;--acc:#6b95ff;--accInk:#0c1022;--ok:#5fd08a;--okBg:#173323;--bad:#ff8585;--badBg:#3a1c1c;--warn:#f0b45a;--warnBg:#3a2c12;--rec:#ff6b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) max(0px,env(safe-area-inset-right)) 0 max(0px,env(safe-area-inset-left))}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px}
header h1{font-size:20px;margin:0}
.icon-btn{border:0;background:none;font-size:22px;padding:6px 8px;color:var(--ink)}
.chips{display:flex;gap:6px;padding:4px 16px 8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--acc);color:var(--accInk);border-color:var(--acc)}
main{padding:8px 16px calc(100px + env(safe-area-inset-bottom))}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav .in{display:flex;width:100%;max-width:640px}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:9px 0 8px;font-size:12px;position:relative}
nav button b{display:block;font-size:21px;font-weight:400;line-height:1.2}
nav button.on{color:var(--acc)}
nav .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:0 6px;line-height:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 18px;min-height:250px;text-align:center}
.tag{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.front{font-size:32px;font-weight:600;margin:12px 0 4px;word-break:break-word}
.info{color:var(--mut);font-size:14px;margin-top:2px}
.back{font-size:22px;margin:6px 0}
.ex{font-size:17px;margin-top:12px}
.exTr{color:var(--mut);font-size:14px}
.photo{max-width:100%;max-height:240px;border-radius:12px;margin:12px auto 0;display:block}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.hint{color:var(--mut);font-size:14px;margin-top:22px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.tool{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:8px 13px;font-size:14px}
.tool.rec{border-color:var(--rec);color:var(--rec)}
button.primary,button.sec,button.danger{display:block;width:100%;border-radius:14px;padding:14px;font-size:17px;border:1px solid var(--acc);margin-top:12px}
button.primary{background:var(--acc);color:var(--accInk)}
button.sec{background:var(--card);color:var(--acc)}
button.danger{background:var(--card);color:var(--bad);border-color:var(--bad)}
button:disabled{opacity:.5}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.rate button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px 2px;font-size:15px}
.rate button small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.rate .r0{border-color:var(--bad)}.rate .r3{border-color:var(--ok)}
.top{display:flex;justify-content:space-between;color:var(--mut);font-size:14px;margin:2px 2px 10px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:16px}
input[type=range]{padding:0}
input[type=checkbox]{width:auto;margin-right:8px;transform:scale(1.2)}
.check{display:flex;align-items:center;color:var(--ink);font-size:15px}
textarea{min-height:80px;resize:vertical}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:14px;margin-top:8px;font-size:17px}
.opt.ok{background:var(--okBg);border-color:var(--ok)}.opt.bad{background:var(--badBg);border-color:var(--bad)}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.b-ok{background:var(--okBg);color:var(--ok)}.b-mid{background:var(--warnBg);color:var(--warn)}.b-bad{background:var(--badBg);color:var(--bad)}
.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line)}
.item .txt{flex:1;min-width:0}
.item .t{font-weight:600}.item .s{color:var(--mut);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .m{color:var(--mut);font-size:12px;white-space:nowrap;text-align:right}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex:none;background:var(--line)}
.empty{text-align:center;color:var(--mut);padding:36px 10px}
.empty b{display:block;font-size:44px;font-weight:400}
.err{color:var(--bad);margin-top:10px;font-size:14px}
.note{color:var(--mut);font-size:14px;margin-top:8px}
.okmsg{color:var(--ok);margin-top:10px;font-size:14px}
details{margin-top:18px}summary{color:var(--acc);padding:6px 0}
.q{font-size:28px;font-weight:600;text-align:center;margin:16px 0 8px;word-break:break-word}
.score{color:var(--mut);text-align:center;font-size:14px}
.media{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.media img{width:84px;height:84px;object-fit:cover;border-radius:10px}
.filebtn{position:relative;overflow:hidden;display:inline-block}
.filebtn input{position:absolute;inset:0;opacity:0;font-size:0}
h2{font-size:17px;margin:24px 0 4px}
.banner{background:var(--warnBg);color:var(--ink);border-radius:14px;padding:12px 14px;margin:0 16px 8px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner button{border:0;background:none;color:var(--mut);font-size:18px;padding:0 4px}
a{color:var(--acc)}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Flashcards</h1><button class="icon-btn" data-act="tab" data-t="settings" aria-label="Settings">⚙️</button></header>
  <div id="banner"></div>
  <div class="chips" id="chips"></div>
  <main id="main"><div class="empty">Loading…</div></main>
</div>
<nav><div class="in" id="nav">
  <button data-act="tab" data-t="study"><b>🗂</b>Study<span class="badge" id="dueBadge" hidden></span></button>
  <button data-act="tab" data-t="quiz"><b>✍️</b>Quiz</button>
  <button data-act="tab" data-t="add"><b>＋</b>Add</button>
  <button data-act="tab" data-t="cards"><b>📚</b>Cards</button>
</div></nav>
<script src="app.js"></script>
</body>
</html>
